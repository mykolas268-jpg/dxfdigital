# 6 mm ply: stiffer boxes and ornaments, wider kerf because the beam waists.
#
name: Laser, 6 mm birch plywood
# A worked example, run by the test suite so it cannot go stale:
#   dxfgen make ornaments --preset laser-6mm-ply -p width=90
example:
  niche: ornaments
  params:
    width: 90

params:
  mode: laser
  material: 6 mm birch ply
  thickness: 6.0
  kerf: 0.22
  clearance: 0.2
  min_wall: 4.0
  pocket_floor: 2.0
