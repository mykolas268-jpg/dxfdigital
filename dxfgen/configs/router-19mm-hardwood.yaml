# Boards and trays in 3/4" hardwood, the usual serving-board stock.
#
name: Router, 19 mm hardwood
# A worked example, run by the test suite so it cannot go stale:
#   dxfgen make boards --preset router-19mm-hardwood -p length=420 -p width=280
example:
  niche: boards
  params:
    length: 420
    width: 280

params:
  mode: router
  material: oak
  thickness: 19.0
  tool_diameter: 6.35
  clearance: 0.2
  min_wall: 10.0           # a board is handled wet; give the walls more meat
  pocket_floor: 6.0
