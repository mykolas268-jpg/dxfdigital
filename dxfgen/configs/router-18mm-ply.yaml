# Flat-pack stock: 18 mm birch plywood on a hobby router with a 1/4" cutter.
#
# Any -p override wins over the values here.
name: Router, 18 mm birch plywood
# A worked example, run by the test suite so it cannot go stale:
#   dxfgen make furniture --preset router-18mm-ply -p form=shelf -p width=800 -p depth=320 -p height=1100
example:
  niche: furniture
  params:
    form: shelf
    width: 800
    depth: 320
    height: 1100

params:
  mode: router
  material: birch plywood
  thickness: 18.0
  tool_diameter: 6.35      # 1/4 inch, the commonest hobby cutter
  clearance: 0.2           # slot = thickness + this
  min_wall: 8.0
  pocket_floor: 5.0
