[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxfgen"
version = "0.1.0"
description = "Parametric generator for machine-ready CNC router and laser DXF files"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=1.26",
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dxfgen = "dxfgen.cli:app"

[tool.setuptools.packages.find]
include = ["dxfgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
