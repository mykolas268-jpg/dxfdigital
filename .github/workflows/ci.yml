name: CI

on:
  push:
  pull_request:

# A push to a branch that already has an open pull request starts two runs.
# Keep only the newest one per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    # The suite takes about four minutes locally; anything past this is a hang,
    # not a slow runner.
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The floor pyproject.toml declares in requires-python.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        # Installing the project itself, rather than requirements.txt, is what
        # makes the packaged configs importable the way a buyer's install is.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest
